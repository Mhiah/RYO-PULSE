[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ryo-pulse"
version = "0.1.0"
description = "RYO Pulse: a read-only RYO skill that classifies whether a token keeps showing up across comparable scan_market snapshots."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "httpx>=0.27", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ryo-pulse = "ryo_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ryo_pulse = ["web/*.html", "web/*.css", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
