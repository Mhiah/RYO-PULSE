name: ci

on:
  push:
    branches: [main, "audit/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # playwright --with-deps cannot install its fonts on the 26.04 image yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" playwright pip-audit bandit ruff
          python -m playwright install --with-deps chromium
      - name: Lint (errors only)
        run: ruff check --select E9,F src api tests scripts
      - name: Unit, integration, property and browser tests
        run: python -m pytest -v -rs
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt
      # skipped: B101 asserts, B104 opt-in --lan bind, B311 retry jitter, B106 "token" is a coin symbol, not a password
      - name: Static security scan
        run: bandit -q -r src api -s B101,B104,B106,B311
      - name: Board cost by watchlist size
        run: python scripts/bench_board.py
